<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | FlowerBook</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">


    <div class="auth-background">

        <div class="floating-flower flower-one">🌸</div>
        <div class="floating-flower flower-two">🌷</div>
        <div class="floating-flower flower-three">🌹</div>
        <div class="floating-flower flower-four">🌻</div>


        <div class="auth-container">


            <!-- LEFT SIDE -->

            <div class="auth-welcome">

                <div class="welcome-logo">
                    🌸
                </div>

                <h1>
                    Welcome to
                    <span>FlowerBook</span>
                </h1>

                <p>
                    Beautiful flowers for beautiful moments.
                </p>

                <div class="welcome-decoration">
                    🌷 🌹 🌸
                </div>

            </div>


            <!-- LOGIN CARD -->

            <div class="auth-card">

                <div class="auth-logo">
                    🌸
                </div>


                <h2>
                    Welcome Back
                </h2>

                <p class="auth-subtitle">
                    Login to continue your flower journey
                </p>


                <form id="login-form">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="login-email">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                📧
                            </span>

                            <input
                                type="email"
                                id="login-email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="login-password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="login-password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggle-password"
                            >
                                👁️
                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="auth-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="remember-me"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a
                            href="#"
                            id="forgot-password"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="auth-submit-btn"
                    >

                        <span>
                            Login to FlowerBook
                        </span>

                        <span class="button-arrow">
                            →
                        </span>

                    </button>


                </form>


                <!-- DIVIDER -->

                <div class="auth-divider">

                    <span>
                        New to FlowerBook?
                    </span>

                </div>


                <!-- REGISTER -->

                <a
                    href="register.html"
                    class="create-account-btn"
                >
                    Create New Account
                </a>


                <p class="auth-footer-text">
                    🌸 Fresh flowers. Beautiful moments.
                </p>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
