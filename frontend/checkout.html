<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FlowerBook | Checkout</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        <span>🌸</span>
        FlowerBook
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#flowers">
            Flowers
        </a>

        <a href="cart.html">
            Cart
        </a>

    </nav>

</header>



<section class="checkout-page">


    <div class="section-heading">

        <p>
            ALMOST THERE
        </p>

        <h2>
            Complete your
            <span>booking</span> 🌸
        </h2>

    </div>



    <div class="checkout-layout">


        <!-- DELIVERY DETAILS -->

        <div class="checkout-form">

            <h3>
                Delivery Details
            </h3>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="customer-name"
                    placeholder="Enter your full name"
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="customer-email"
                    placeholder="Enter your email address"
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="customer-phone"
                    placeholder="Enter your phone number"
                >

            </div>


            <div class="form-group">

                <label>
                    Delivery Address
                </label>

                <textarea
                    id="customer-address"
                    placeholder="House No, Street, Area, City..."
                    rows="4"
                ></textarea>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label>
                        Delivery Date
                    </label>

                    <input
                        type="date"
                        id="delivery-date"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Delivery Time
                    </label>

                    <select id="delivery-time">

                        <option value="">
                            Select time
                        </option>

                        <option>
                            9 AM - 12 PM
                        </option>

                        <option>
                            12 PM - 3 PM
                        </option>

                        <option>
                            3 PM - 6 PM
                        </option>

                        <option>
                            6 PM - 9 PM
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-group">

                <label>
                    Special Message 💌
                </label>

                <textarea
                    id="special-message"
                    placeholder="Write a message for your loved one..."
                    rows="3"
                ></textarea>

            </div>


            <button
                class="place-order-btn"
                onclick="placeOrder()"
            >
                🌸 Place Flower Booking
            </button>

        </div>



        <!-- ORDER SUMMARY -->

        <div class="checkout-summary">

            <h3>
                Your Order
            </h3>

            <div id="checkout-items">

                Loading...

            </div>


            <hr>


            <div class="checkout-total">

                <span>
                    Total
                </span>

                <strong id="checkout-total">
                    ₹0
                </strong>

            </div>

        </div>


    </div>

</section>



<footer>

    <div class="footer-logo">
        🌸 FlowerBook
    </div>

    <p>
        Fresh flowers. Beautiful moments.
    </p>

</footer>



<script src="js/checkout.js"></script>


</body>

</html>
